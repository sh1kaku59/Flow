services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"

  backend:
    build:
      context: ./backend-node
    restart: unless-stopped
    expose:
      - "9000"
    env_file:
      - ./backend-node/.env
    environment:
      - REDIS_URL=redis://redis:6379
      - AI_SERVICE_URL=http://ai-service:8001
      - BACKEND_CALLBACK_URL=https://flowvn.me/api/ai/progress
      - FRONTEND_ORIGIN=https://flowvn.me
    depends_on:
      - redis
      - ai-service

  worker:
    build:
      context: ./backend-node
    restart: unless-stopped
    command: ["node", "src/worker.js"]
    env_file:
      - ./backend-node/.env
    environment:
      - REDIS_URL=redis://redis:6379
      - AI_SERVICE_URL=http://ai-service:8001
      - BACKEND_CALLBACK_URL=https://flowvn.me/api/ai/progress
    depends_on:
      - redis
      - ai-service

  ai-service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: kltn-ai-service
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - ./backend-node/.env
    environment:
      - FRONTEND_ORIGIN=https://flowvn.me
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
    restart: unless-stopped
    expose:
      - "80"

  reverse-proxy:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./reverse-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./reverse-proxy/certbot/www:/var/www/certbot
      - ./reverse-proxy/certbot/conf:/etc/letsencrypt
    depends_on:
      - frontend
      - backend
      - ai-service

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - ./reverse-proxy/certbot/www:/var/www/certbot
      - ./reverse-proxy/certbot/conf:/etc/letsencrypt
    entrypoint: /bin/sh -c "trap exit TERM; while :; do sleep 12h & wait $${!}; certbot renew --webroot -w /var/www/certbot; done"
